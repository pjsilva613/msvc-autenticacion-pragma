server:
  port: 8080
spring:
  application:
    name: "autenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  jpa:
    hibernate:
      ddl-auto: "update"
    generate-ddl: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true


cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"


adapters:
  r2dbc:
    host: "localhost"
    port: 5532
    database: "test"
    schema: "public"
    username: "postgres"
    password: "Pjsilva613"

logging:
  level:
    org:
      hibernate:
        SQL=debug: